name: SDK contracts
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: typescript
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest pytest-asyncio
        working-directory: python
      - run: python -m pytest tests/ -q -o addopts=''
        working-directory: python
