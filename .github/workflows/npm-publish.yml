name: Publish TypeScript SDK

on:
  push:
    tags:
      - 'typescript/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing TypeScript release tag version (for example 1.8.0)'
        required: true
        type: string
      check_only:
        description: 'Verify registry authentication without publishing'
        default: true
        type: boolean

permissions:
  contents: read
concurrency:
  group: publish-northrelay-typescript
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve immutable release tag
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION=${REQUESTED_VERSION:-${GITHUB_REF#refs/tags/typescript/v}}
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=typescript/v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify registry authentication and package access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.NODE_AUTH_TOKEN;
          if (!token) throw new Error('NPM_TOKEN is missing from the publishing repository');
          const headers = {Authorization: `Bearer ${token}`};
          const identity = await fetch('https://registry.npmjs.org/-/whoami', {headers});
          if (!identity.ok) throw new Error(`Registry authentication failed (HTTP ${identity.status}); check northrelay-sdks NPM_TOKEN, including repository overrides of organization secrets`);
          const {username} = await identity.json();
          if (typeof username !== 'string') throw new Error('Unexpected npm identity response');
          console.log('Registry authentication accepted');
          const access = await fetch(`https://registry.npmjs.org/-/package/@northrelay%2fsdk/collaborators?user=${encodeURIComponent(username)}`, {headers});
          if (access.ok) {
            const entries = await access.json();
            console.log(`Package collaborator permission: ${entries[username] === 'read-write' ? 'read-write' : 'not confirmed'}`);
          } else {
            console.log(`Package access inspection unavailable (HTTP ${access.status}); token package restrictions and automation policy must also permit publishing`);
          }
          NODE

      - name: Check existing immutable npm release
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STATUS=$(curl --silent --show-error --output /tmp/npm-release.json --write-out '%{http_code}' "https://registry.npmjs.org/@northrelay%2fsdk/$VERSION")
          case "$STATUS" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Registry lookup failed: HTTP $STATUS"; exit 1 ;;
          esac

      - name: Validate and build release
        if: steps.registry.outputs.published != 'true' && inputs.check_only != true
        working-directory: typescript
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e 'if(require("./package.json").version !== process.env.EXPECTED_VERSION) process.exit(1)'
          npm ci
          npm run typecheck
          npm run build
          npm test

      - name: Publish to npm
        if: steps.registry.outputs.published != 'true' && inputs.check_only != true
        working-directory: typescript
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHECK_ONLY: ${{ inputs.check_only }}
          ALREADY_PUBLISHED: ${{ steps.registry.outputs.published }}
        run: |
          if [ "$ALREADY_PUBLISHED" = true ]; then
            echo "@northrelay/sdk@$VERSION already exists; publication skipped"
          elif [ "$CHECK_ONLY" = true ]; then
            echo 'Authentication inspection completed; no package published'
          else
            echo "Published @northrelay/sdk@$VERSION"
          fi
